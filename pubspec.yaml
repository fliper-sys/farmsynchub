name: farmsynchub
description: "FarmSync Hub - Farm Management Information System for smallholder farmers in Jos South LGA, Plateau State, Nigeria."
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.9

  # Firebase
  firebase_admin: ^0.3.1+4
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.2
  firebase_app_check: ^0.3.2+10
  cloud_firestore: ^5.0.0
  firebase_ai: ^2.3.0

  # PDF Export
  pdf: ^3.10.7
  share_plus: ^12.0.2

  # Charts
  fl_chart: ^0.66.2

  # Navigation
  go_router: ^13.0.1
  lottie: ^3.1.2

  # Fonts
  google_fonts: ^6.1.0

  # Utils
  intl: ^0.20.2
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.2
  path: ^1.8.3
  uuid: ^4.2.1
  shimmer: ^3.0.0
  shared_preferences: ^2.5.5
  http: ^1.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  intl_phone_number_input: ^0.7.2
  file_picker: ^11.0.2
  flutter_local_notifications: ^19.5.0
  firebase_messaging: ^15.2.10
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2
  google_sign_in: ^6.2.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/appicon.png
    - assets/
    - assets/ui/auth_reference.jpeg
    - assets/ui/leaf_background.jpeg
    - assets/ui/leaf_field.jpeg
    - assets/ui/smart_farm.jpeg
    - assets/ui/field_sprayer.jpeg
    - assets/ui/produce_market.jpeg
    - assets/ui/farm_landscape.jpeg
  fonts:
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/DM_Serif_Display/DMSerifDisplay-Regular.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Bold.ttf
          weight: 700
