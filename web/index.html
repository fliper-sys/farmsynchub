<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="description" content="FarmSync Jos South - Farm Management Information System for smallholder farmers in Jos South LGA, Plateau State, Nigeria.">

  <meta name="google-signin-client_id" content="190353139949-8vjnn71ku91tvp75kpl2q5ete9hcpnd1.apps.googleusercontent.com">

  <script src="https://www.google.com/recaptcha/enterprise.js?render=6Lf3WiMtAAAAABW5BIvb1-uny6fW0fOc0JU4lrkq"></script>
  <!-- Your code -->

  <title>FarmSync Hub</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Enhanced Splash Screen Styles */
    :root {
      --splash-height: 100vh;
      --accent-1: #2E7D32;
      --accent-2: #81C784;
      --accent-3: #A5D6A7;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: var(--splash-height);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      overflow: hidden;
      background: radial-gradient(1200px 600px at 10% 20%, rgba(255,255,255,0.04), transparent 10%),
                  linear-gradient(135deg, var(--accent-1) 0%, #4CAF50 25%, var(--accent-2) 60%, var(--accent-3) 100%);
      color: white;
    }

    .splash-inner {
      text-align: center;
      max-width: 520px;
      padding: 24px;
      transform: translateY(0);
      animation: floatUp 900ms cubic-bezier(.2,.9,.2,1) 1;
    }

    @keyframes floatUp {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .app-logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background-image: url('favicon.png');
      background-size: 64%;
      background-repeat: no-repeat;
      background-position: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18), inset 0 -8px 18px rgba(0,0,0,0.06);
      transform-origin: center;
      animation: logoBounce 1400ms ease-in-out infinite;
    }

    @keyframes logoBounce {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
      100% { transform: translateY(0) scale(1); }
    }

    .app-title { font-family: 'DM Serif Display', serif; font-size: 34px; margin: 6px 0 4px; }
    .app-subtitle { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 300; opacity: 0.95; margin-bottom: 18px; }

    /* Progress bar */
    .progress-wrap { width: 220px; margin: 12px auto 0; }
    .progress { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.15); overflow: hidden; position: relative; }
    .progress::before {
      content: '';
      position: absolute; left: -40%; top: 0; bottom: 0; width: 40%;
      background: linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0.36), rgba(255,255,255,0.18));
      transform: skewX(-12deg);
      animation: prog 1.6s linear infinite;
    }
    @keyframes prog { 0% { left: -40%; } 100% { left: 120%; } }

    .loading-text { margin-top: 8px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; opacity: 0.95; }

    .fade-out { opacity: 0 !important; pointer-events: none; transition: opacity 560ms ease-in-out; }

    /* Responsive */
    @media (max-width: 480px) {
      .app-title { font-size: 28px; }
      .app-logo { width: 78px; height: 78px; }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = "{{flutter_service_worker_version}}";
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-inner">
      <div class="app-logo" aria-hidden="true"></div>
      <h1 class="app-title">FarmSync Hub</h1>
      <p class="app-subtitle">Farm Management Information System</p>
      <div class="progress-wrap">
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        <div class="loading-text">Starting application — preparing resources…</div>
      </div>
    </div>
  </div>

  <script>
    {{flutter_bootstrap_js}}
  </script>

  <script>
    // Ensure the splash only clears when Flutter renders its first frame.
    // We wait for two signals: the window load and the Flutter 'flutter-first-frame' event.
    (function() {
      const splash = document.getElementById('splash-screen');
      let flutterReady = false;
      let windowLoaded = false;

      function hideSplash() {
        if (!splash) return;
        // Add fade class (CSS handles transition)
        splash.classList.add('fade-out');
        // After the fade, remove it from layout
        setTimeout(() => {
          try { splash.style.display = 'none'; } catch (e) {}
        }, 600);
      }

      function tryHide() {
        // both signals must be true to ensure stability
        if (flutterReady && windowLoaded) hideSplash();
      }

      // Window load
      window.addEventListener('load', () => {
        windowLoaded = true;
        tryHide();
      }, { once: true });

      // Flutter dispatches a 'flutter-first-frame' event when the first frame is rendered.
      // Listen for that event to ensure Flutter UI is visible before hiding the splash.
      window.addEventListener('flutter-first-frame', () => {
        flutterReady = true;
        tryHide();
      }, { once: true });

      // Fallback: if flutter-first-frame never fires (older tooling or errors), hide after timeout.
      // This prevents an indefinite splash; set a reasonably generous timeout.
      setTimeout(() => {
        flutterReady = true;
        tryHide();
      }, 12000);
    })();
  </script>
</body>
</html>
